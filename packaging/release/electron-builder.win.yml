# electron-builder - Windows 10/11 x64: NSIS installer + portable exe.
#
# Run it through packaging/release/build.mjs, which stages build/release/app first and
# passes that directory as the project directory:
#
#   node packaging/release/build.mjs win
#
# The project directory is the staged app, so every path below is relative to
# build/release/app, NOT to this file. package.json in that directory is generated by
# stage.mjs (`main` is "desktop/main.mjs"); desktop/package.json is never modified.
#
# ---------------------------------------------------------------------------------
# RESOURCE MAP - keep in sync with packaging/release/README.md section 1
#
# App payload (`files`, packed as a plain directory because asar is off):
#   package.json                     generated release manifest (main: desktop/main.mjs)
#   desktop/main.mjs                 Electron entry; imports ../harness/src/ui.mjs
#   desktop/preload.mjs              loaded by main.mjs via new URL("./preload.mjs", ...)
#   harness/src/**/*.mjs             the engine (21 modules), imported by main.mjs
#   harness/ui/**                    served by ui.mjs: UI_DIR = <harness>/ui
#   harness/data/model-catalog.json  catalog.mjs: CATALOG_PATH = <harness>/data
#   harness/data/llama-runtime.json  starter-model.mjs: RUNTIME_PATH = <harness>/data
#   harness/data/media-models.json   model-downloads.mjs: MEDIA_PATH = <harness>/data
#   harness/data/whisper-runtime.json  voice-runner.mjs: WHISPER_RUNTIME_PATH = <harness>/data
#   harness/data/comfy-workflows/**  comfy-runner.mjs: WORKFLOW_DIR = <harness>/data/comfy-workflows
#   harness/harness.config.json      plugins.mjs; rewritten neutral at staging time
#   harness/plugins/**               plugins.mjs: <harness>/plugins
#   harness/plugin-libs/**           ui-plugins.mjs: three.js and pdf.js at /plugin-lib
#   harness/store/index.json        store.mjs: <harness>/store/index.json
#   harness/store/modules/**         module registry the store index points at
#   harness/src/voice/**             voice.mjs: VOICE_DIR = <harness>/src/voice
#
# extraResources (this file cannot use them for the harness: every path above is
# resolved relative to import.meta.url inside the app payload, and extraResources land
# in resources/, which is not one level above desktop/):
#   router/**                        the model router, a separate process the window
#                                    talks to over http://127.0.0.1:8077/v1
#
# Never shipped: node_modules, harness/src/voice/.venv, router/data (API keys),
# router/logs, router/state, harness/test, harness/.scratch, harness/plugins/store.lock.json
# ---------------------------------------------------------------------------------

appId: dev.rosalena.harness
productName: Rosalena Harness
executableName: Rosalena-Harness
copyright: Copyright (c) 2026 Rosalena

directories:
  output: dist
  buildResources: build

# A plain directory, not an asar: the app entry does a dynamic
# `import("../harness/src/ui.mjs")` and the engine resolves ui/, plugins/, data/ and
# store/ from import.meta.url. Keeping the layout identical to the repo removes every
# asar/ESM edge case from the release path, and makes the shipped file list auditable.
# Cost: startup reads loose files (negligible here) and the code is not packed.
asar: false

files:
  - package.json
  - desktop/main.mjs
  - desktop/menu.mjs
  - desktop/notify.mjs
  - desktop/preload.mjs
  - desktop/router-supervisor.mjs
  - desktop/updater.mjs
  - harness/src/**/*.mjs
  - harness/src/voice/README.md
  - harness/src/voice/transcribe.py
  - harness/src/voice/setup.ps1
  - harness/src/voice/selftest.ps1
  - harness/src/voice/win-speech.ps1
  - harness/ui/**/*
  - harness/data/model-catalog.json
  - harness/data/llama-runtime.json
  - harness/data/media-models.json
  - harness/data/whisper-runtime.json
  - harness/data/student-programs.json
  - harness/data/node-runtime.json
  - harness/data/comfy-workflows/*.json
  - harness/harness.config.json
  - harness/plugins/**/*
  - harness/plugin-libs/**/*
  - harness/store/index.json
  - harness/store/modules/**/*
  - harness/skills/**/*
  - "!**/node_modules/**"
  - "!**/.venv/**"
  - "!**/__pycache__/**"
  - "!**/*.pyc"
  - "!**/*.log"
  - "!harness/plugins/store.lock.json"
  - "!harness/**/test/**"
  - "!harness/.scratch/**"
  - "!router/**"

extraResources:
  - from: router
    to: router
    filter:
      - "**/*"
      - "!**/node_modules/**"
      - "!**/test/**"
      - "!**/logs/**"
      - "!**/state/**"
      - "!**/data/**"
      - "!**/scripts/**"
  # The router's identity prompt: router.config.json reads it as
  # `../data/prompts/rosalena.md`, so it belongs at <resources>/data/prompts/rosalena.md.
  # router/src/persona.mjs exits 2 when it is missing, which would be a router that never
  # starts - the same defect on Windows as on macOS. Keys are still excluded (router/data/**
  # above); this is one markdown file.
  - from: data/prompts
    to: data/prompts
    filter:
      - "rosalena.md"

publish: null

# Default file name for any target that does not override it below.
artifactName: Rosalena-Harness-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Rosalena Harness
  deleteAppDataOnUninstall: false
  artifactName: Rosalena-Harness-Setup-${version}-${arch}.${ext}

portable:
  artifactName: Rosalena-Harness-${version}-${arch}-portable.${ext}
